<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPL WORLD MANAGER</title>
<style>
:root{
  --bg:#06101c;--panel:#0c1826;--panel2:#101f30;--line:#24384e;
  --text:#f4f7fb;--muted:#91a4b8;--gold:#f4b52b;--blue:#14b8ff;
  --green:#20c878;--orange:#ff8a00;--red:#ff5c6c;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#10243a 0,#06101c 42%,#030912 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button{font:inherit}
.top{position:sticky;top:0;z-index:10;background:#06101cf2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.nav{max-width:1250px;margin:auto;display:flex;align-items:center;gap:8px;padding:12px 18px;overflow:auto}
.brand{font-weight:900;min-width:220px;font-size:18px}.brand small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.nav button{background:transparent;border:0;color:var(--muted);padding:10px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.nav button.active,.nav button:hover{background:#12304a;color:#fff}
.money{margin-left:auto;white-space:nowrap;color:#ffd35a;font-weight:800}
.container{max-width:1250px;margin:auto;padding:20px}
.page-title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}
h1{margin:0;font-size:32px}h2{margin:0 0 10px}h3{margin:0 0 8px}.muted{color:var(--muted)}
.hero{border:1px solid #9b6a00;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,#241a00,#0d1620 70%);min-height:260px;padding:28px;text-align:center;position:relative}
.hero .tag{position:absolute;left:0;top:0;background:#9b6500;padding:9px 28px;font-weight:900}
.hero .m8{font-size:72px;font-weight:900;color:#d8aa48;margin-top:20px}.hero h2{color:#ffc94e;font-size:30px}.hero p{color:#4bbcff;font-size:20px}
.grid{display:grid;gap:14px}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.section{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#081522}
.section-head{padding:12px 16px;font-size:18px;font-weight:900}.sea{background:#075e73}.ea{background:#a95100}.amer{background:#056b31}
.card{background:linear-gradient(180deg,#122233,#0a1622);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:#3f6386}.flag{font-size:28px}.card .title{font-weight:900;font-size:18px}.card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#172b40;color:#9fd8ff;font-size:11px;font-weight:800;margin:4px 4px 0 0}
.s{background:#513a00;color:#ffd65e}.a{background:#083d31;color:#70f0bb}.b{background:#173c62;color:#8fd0ff}
.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button{border:1px solid var(--line);background:#0d1a28;color:#b9c8d8;padding:9px 14px;border-radius:8px;white-space:nowrap}.tabs button.active{background:#1262a1;color:#fff}
.list{display:grid;gap:10px}.team{display:flex;justify-content:space-between;align-items:center;gap:12px}.team-left{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:10px;background:#17293a;display:grid;place-items:center;font-weight:900}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.primary{background:#087ac1;border:0;color:white;padding:11px 16px;border-radius:8px;font-weight:900;cursor:pointer}.goldbtn{background:#b47b00;color:#fff;border:0;padding:11px 16px;border-radius:8px;font-weight:900;cursor:pointer}.danger{background:#61202a}.ghost{background:#102234;border:1px solid var(--line);color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}
.panel{background:#0b1826;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.statgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#101f30;border:1px solid var(--line);border-radius:10px;padding:14px}.stat b{font-size:22px;display:block;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:#9db0c4}
select,input{width:100%;background:#091522;color:white;border:1px solid var(--line);padding:11px;border-radius:8px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:30;padding:18px}.modal.show{display:flex}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#0b1826;border:1px solid #35516d;border-radius:12px;padding:20px}
.toast{position:fixed;right:15px;bottom:15px;background:#13273a;border:1px solid #3a5975;padding:12px 16px;border-radius:8px;display:none;z-index:40}
.small{font-size:12px}.center{text-align:center}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:850px){.grid4,.grid3{grid-template-columns:repeat(2,1fr)}.statgrid{grid-template-columns:repeat(2,1fr)}.money{display:none}}
@media(max-width:560px){.container{padding:12px}.grid4,.grid3,.grid2,.formgrid{grid-template-columns:1fr}h1{font-size:25px}.hero .m8{font-size:48px}.nav{padding:8px}.brand{min-width:170px}.statgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="nav">
    <div class="brand">🏆 MPL WORLD MANAGER<small>Build Your Legacy</small></div>
    <button data-nav="home">⌂ Home</button>
    <button data-nav="world">🌐 World</button>
    <button data-nav="calendar">▣ Calendar</button>

    <button data-nav="career">⚔ Career</button>
    <div class="money" id="money">🪙 1,000,000,000</div>

</div>

<main class="container" id="app"></main>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>

const ROSTERS = {

    ["Lynchh","EXP",82],["Demonkite","JUNGLE",84],["Rinz","MID",83],["Clayyy","MID",81],["Kuroky","GOLD",82],["Sutsujin","GOLD",80],["Idok","ROAM",84]

  ],

};
const ROLE_ORDER=["EXP","JUNGLE","MID","GOLD","ROAM"];
function rosterForTeam(team){return ROSTERS[team]||[]}
function rosterHTML(){
  const c=state.career, roster=rosterForTeam(c.team);
  if(!roster.length) return `<div class="empty"><h2>Roster belum tersedia</h2><p>Database roster tim ini belum dimasukkan karena kita tidak mau mengarang nama pemain. Tim tetap bisa dipilih; roster akan ditambahkan dari sumber kompetisi.</p><button class="ghost" onclick="closeModal()">Tutup</button></div>`;
  const lineup=c.lineup||{};
  return `<h2>👥 Roster & Lineup</h2>
  <p class="muted">Pilih pemain aktif untuk 5 role utama. Rating memengaruhi kekuatan simulasi pertandingan.</p>
  <div class="panel"><h3>⭐ Starting Lineup</h3>
  ${ROLE_ORDER.map(role=>`<div class="row"><span><b>${role}</b></span><select onchange="setLineup('${role}',this.value)">
    <option value="">-- Pilih pemain --</option>${roster.filter(x=>x[1]===role).map(x=>`<option value="${x[0]}" ${lineup[role]===x[0]?"selected":""}>${x[0]} — OVR ${x[2]}</option>`).join("")}
  </select></div>`).join("")}</div>
  <div class="list">${roster.map((x,i)=>`<div class="card row"><div><b>${x[0]}</b><div class="sub">${x[1]} • OVR ${x[2]}</div></div><span class="badge">${lineup[x[1]]===x[0]?"STARTER":"ROSTER"}</span></div>`).join("")}</div>
  <button class="primary" onclick="saveLineup()">Simpan Lineup</button>`;
}
function setLineup(role,name){if(!state.career.lineup)state.career.lineup={};state.career.lineup[role]=name;save();rosterHTMLRefresh()}
function rosterHTMLRefresh(){document.getElementById("modalbox").innerHTML=rosterHTML()}
function saveLineup(){save();closeModal();render();toast("Lineup tersimpan!")}

const STATE_KEY="mplwm_v2";
let state=JSON.parse(localStorage.getItem(STATE_KEY)||"null")||{
  page:"home",money:1000000000,week:1,day:14,
  country:null,league:null,team:null,career:null,
  history:[],saved:false
};

function save(){localStorage.setItem(STATE_KEY,JSON.stringify(state));updateMoney()}
function updateMoney(){document.getElementById("money").textContent="🪙 "+fmt(state.money)}
function fmt(n){return Math.round(n).toLocaleString("id-ID")}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
function allCountries(){return Object.values(DB.regions).flatMap(r=>r.countries)}
function findCountry(id){return allCountries().find(c=>c.id===id)}
function findLeague(id){for(const c of allCountries())for(const l of c.leagues)if(l.id===id)return l}
function initials(s){return s.split(" ").map(x=>x[0]).slice(0,3).join("").toUpperCase()}
function tierClass(t){return t.startsWith("S")?"s":t.startsWith("A")?"a":"b"}

document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{state.page=b.dataset.nav;render()});

function render(){
  updateMoney();
  const app=document.getElementById("app");
  if(state.page==="home")app.innerHTML=home();
  if(state.page==="world")app.innerHTML=world();
  if(state.page==="calendar")app.innerHTML=calendar();
  if(state.page==="rankings")app.innerHTML=rankings();
  if(state.page==="career")app.innerHTML=career();
  if(state.page==="country")app.innerHTML=countryPage();
  if(state.page==="league")app.innerHTML=leaguePage();
  if(state.page==="team")app.innerHTML=teamPage();
  bind();
}

function home(){
return `<div class="page-title"><div><h1>🌐 MPL WORLD MANAGER</h1><div class="muted">Bangun organisasi dari tim kecil sampai panggung dunia.</div></div><button class="primary" onclick="go('world')">Jelajahi World →</button></div>
<div class="hero"><div class="tag">ROAD TO M8</div><div class="m8">M8</div><h2>WORLD CHAMPIONSHIP</h2><p>Coming Soon</p><div class="grid grid4" style="margin-top:22px">
${[
["🇵🇭","Philippines"],["🇮🇩","Indonesia"],["🇲🇾","Malaysia"],["🌍","MENA"],["🇹🇷","Türkiye"],["🌐","EECA"]
].map(x=>`<div><div class="flag">${x[0]}</div><b>${x[1]}</b></div>`).join("")}</div></div>
<div class="grid grid3" style="margin-top:18px">
<div class="panel"><h3>🎯 Mulai dari mana saja</h3><p class="muted">Pilih organisasi besar atau tim kecil. Semua punya jalan karier.</p><button class="primary" onclick="go('world')">Pilih Tim</button></div>
<div class="panel"><h3>📈 Bangun Legacy</h3><p class="muted">Training, transfer, kontrak, roster, staff, keuangan, dan reputasi.</p></div>
<div class="panel"><h3>🌍 Dunia tetap berjalan</h3><p class="muted">AI menjalankan liga dan transfer ketika kamu tidak berada di sana.</p></div>
</div>`;
}

function world(){
return `<div class="page-title"><div><h1>🌍 WORLD</h1><div class="muted">Pilih region untuk melihat liga dan tim.</div></div><div class="badge">2026 DATABASE</div></div>
<div class="hero" style="min-height:170px"><div class="tag">ROAD TO M8</div><div class="m8" style="font-size:48px">M8 WORLD</div><p>Panggung tertinggi menunggu.</p></div>
${Object.values(DB.regions).map(r=>regionBlock(r)).join("")}
<div class="section"><div class="section-head" style="background:#6b4c00">🏆 INTERNATIONAL</div><div class="grid grid4" style="padding:14px">${DB.international.map(t=>`<div class="card"><div class="title">${t.name}</div><span class="badge ${tierClass(t.tier)}">${t.tier}</span><div class="sub">${t.route}</div></div>`).join("")}</div></div>`;
}
function regionBlock(r){
return `<div class="section"><div class="section-head ${r.color}">⌃ &nbsp; ${r.name}</div><div style="padding:14px"><div class="grid grid4">${r.countries.map(c=>`<div class="card" onclick="selectCountry('${c.id}')"><div class="flag">${c.flag}</div><div class="title">${c.name}</div><div class="sub">${c.leagues.length} competition aktif di database</div>${c.leagues.map(l=>`<span class="badge ${tierClass(l.tier)}">${l.name.replace(/ Season \\d+| 2026/g,"")}</span>`).join("")}</div>`).join("")}</div></div></div>`;
}

function countryPage(){
const c=findCountry(state.country); if(!c)return world();
return `<div class="page-title"><div><h1>${c.flag} ${c.name}</h1><div class="muted">Pilih kompetisi. Tier 2 bukan jalan buntu.</div></div><button class="ghost" onclick="go('world')">← World</button></div>
<div class="grid grid2">${c.leagues.map(l=>`<div class="card" onclick="selectLeague('${l.id}')"><span class="badge ${tierClass(l.tier)}">${l.tier}</span><div class="title" style="margin-top:8px">${l.name}</div><div class="sub">${l.teams.length} tim • Tier ${l.level}</div><p class="muted small">Klik untuk melihat semua tim yang tersedia.</p></div>`).join("")}</div>`;
}

function leaguePage(){
const l=findLeague(state.league); if(!l)return world();
const c=findCountry(state.country);
return `<div class="page-title"><div><h1>${l.name}</h1><div class="muted">${c.flag} ${c.name} • ${l.tier} • Tier ${l.level}</div></div><button class="ghost" onclick="go('country')">← Liga</button></div>
<div class="panel"><b>Aturan karier:</b> tim kecil dapat membangun reputasi, memenangkan kompetisi, masuk jalur regional, dan mengejar panggung internasional jika jalur turnamennya terbuka.</div>
<div class="list">${l.teams.map((t,i)=>`<div class="card team" onclick="selectTeam('${encodeURIComponent(t)}')"><div class="team-left"><div class="logo">${initials(t)}</div><div><div class="title">${t}</div><div class="sub">Seed #${i+1} • ${l.level===1?"Professional":"Development / Challenger"}</div></div></div><span class="badge ${tierClass(l.tier)}">${l.tier}</span></div>`).join("")}</div>`;
}

function teamPage(){
const l=findLeague(state.league), c=findCountry(state.country), t=state.team;
return `<div class="page-title"><div><h1>🛡️ ${t}</h1><div class="muted">${c.flag} ${c.name} • ${l.name}</div></div><button class="primary" onclick="startCareer()">Mulai Karier →</button></div>
<div class="grid grid3">
<div class="panel"><h3>🏢 Organisasi</h3><p class="muted">Kamu mengelola organisasi, bukan hanya satu lineup.</p></div>
<div class="panel"><h3>👥 Roster</h3><p class="muted">Rekrut, lepas, pinjamkan, dan kembangkan pemain.</p></div>
<div class="panel"><h3>🌍 Road to International</h3><p class="muted">Performa dan jalur kompetisi menentukan kesempatan berikutnya.</p></div>
</div>`;
}

function career(){
if(!state.career)return `<div class="empty"><h2>Belum ada karier</h2><button class="primary" onclick="go('world')">Pilih Tim</button></div>`;
const c=state.career;

function ensureSeason(c){
  if(c.schedule && c.standings && c.gamesPlayed!==undefined) return;
  const l=findLeague(state.league);
  const teams=l?l.teams:[c.team,"AI Team 1","AI Team 2","AI Team 3","AI Team 4","AI Team 5","AI Team 6","AI Team 7","AI Team 8"];
  const unique=[...new Set([c.team,...teams])].slice(0,12);
  c.teams=unique;
  c.schedule=makeDoubleRoundRobin(unique);
  c.schedule.forEach(m=>m.played=false);
  c.gamesPlayed=0;c.wins=0;c.losses=0;c.points=0;
  c.standings=unique.map(team=>({team,played:0,wins:0,losses:0,points:0,gf:0,ga:0}));
  c.week=1;c.position=1;
  save();
}

function makeDoubleRoundRobin(teams){
  let arr=teams.slice();
  if(arr.length%2) arr.push("BYE");
  const n=arr.length, rounds=n-1, half=n/2, first=[];
  for(let r=0;r<rounds;r++){
    for(let i=0;i<half;i++){
      const a=arr[i],b=arr[n-1-i];
      if(a!=="BYE"&&b!=="BYE") first.push({week:r+1,home:r%2?b:a,away:r%2?a:b,played:false});
    }
    arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  return first.concat(first.map(m=>({...m,week:m.week+rounds,home:m.away,away:m.home,played:false})));
}

function getStanding(c,team){
  return c.standings.find(x=>x.team===team);
}
function strength(c,team){
  const s=getStanding(c,team);
  let base=55+(s?Math.min(20,s.points*2):0);
  if(team===c.team) base+=c.reputation*.45+c.chemistry*.15+c.morale*.12;
  else base+=Math.random()*15;
  return base;
}
function simulateMatch(c,m){
  const hs=strength(c,m.home), as=strength(c,m.away);
  const p=1/(1+Math.exp((as-hs)/12));
  const homeWin=Math.random()<p;
  let h=homeWin?2:Math.floor(Math.random()*2), a=homeWin?Math.floor(Math.random()*2):2;
  if(h===a) homeWin ? h=2 : a=2;
  m.homeScore=h;m.awayScore=a;m.games=3;m.played=true;
  const H=getStanding(c,m.home),A=getStanding(c,m.away);
  H.played++;A.played++;H.gf+=h;H.ga+=a;A.gf+=a;A.ga+=h;
  if(h>a){H.wins++;H.points++;A.losses++}else{A.wins++;A.points++;H.losses++}
  c.gamesPlayed++;
  if(m.home===c.team||m.away===c.team){
    const won=(m.home===c.team?h>a:a>h);
    if(won){c.wins++;c.points++;c.reputation+=2;c.morale=Math.min(100,c.morale+3);c.budget+=25000000}
    else{c.losses++;c.morale=Math.max(0,c.morale-3);c.budget+=5000000}
    c.chemistry=Math.min(100,c.chemistry+1);
    c.news.unshift((won?"🔥 Menang ":"❌ Kalah ")+`${m.home} ${h}-${a} ${m.away}`);
    c.news=c.news.slice(0,5);
  }
}
function sortStandings(c){
  c.standings.sort((a,b)=>b.points-a.points || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
  c.position=Math.max(1,c.standings.findIndex(x=>x.team===c.team)+1);
}
function playSpecific(i){
  const c=state.career;ensureSeason(c);const m=c.schedule[i];
  if(!m||m.played)return;
  // Simulate all earlier unplayed matches so the season advances naturally.
  for(let j=0;j<=i;j++) if(!c.schedule[j].played) simulateMatch(c,c.schedule[j]);
  sortStandings(c); c.week=Math.min(999,Math.floor(c.gamesPlayed/Math.max(1,c.teams.length/2))+1);
  save();state.page="calendar";render();toast("Match selesai!");
}
function playNextMatch(){
  const c=state.career;ensureSeason(c);

  playSpecific(i);
}
