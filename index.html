<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MPL World Manager</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #171b25;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: #191e29;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #f5c542;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .team {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #303642;
        }
    </style>
</head>

<body>

<header>
    <h1>🌍 MPL World Manager</h1>
    <p>Esports Management Simulator</p>
</header>

<div class="container">

    <div class="card">
        <h2>🏆 Indonesia Tier 1</h2>

        <div class="team">
            <span>RRQ</span>
            <span>0 PTS</span>
        </div>

        <div class="team">
            <span>ONIC</span>
            <span>0 PTS</span>
        </div>

        <div class="team">
            <span>EVOS</span>
            <span>0 PTS</span>
        </div>

        <div class="team">
            <span>BTR</span>
            <span>0 PTS</span>
        </div>
    </div>

    <div class="card">
        <h2>⚔️ Pertandingan</h2>

        <p id="match">
            RRQ vs ONIC
        </p>

        <button onclick="mainMatch()">
            MAINKAN MATCH
        </button>

        <p id="result"></p>
    </div>

</div>

<script>

function mainMatch() {

    const rrq = 85;
    const onic = 88;

    const rrqPower = rrq + Math.random() * 20;
    const onicPower = onic + Math.random() * 20;

    const result = document.getElementById("result");

    if (rrqPower > onicPower) {
        result.innerHTML = "🏆 RRQ MENANG!";
    } else {
        result.innerHTML = "🏆 ONIC MENANG!";
    }
}

</script>

</body>
</html>
