<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MPL World Manager</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080b12;
    color:white;
    min-height:100vh;
}

button{
    border:none;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}


/* =========================
   PILIH TIM
========================= */

#teamSelect{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.select-box{
    width:100%;
    text-align:center;
}

.logo-title{
    font-size:13px;
    color:#777;
    letter-spacing:3px;
    margin-bottom:10px;
}

h1{
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#888;
    margin-bottom:25px;
}

.team-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.team-card{
    background:#111722;
    border:2px solid #202938;
    border-radius:14px;
    padding:18px 8px;
    transition:.2s;
}

.team-card.selected{
    border-color:#00d9ff;
    background:#10212a;
}

.team-name{
    font-size:15px;
    font-weight:bold;
}

.team-region{
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.team-rating{
    color:#999;
    font-size:11px;
    margin-top:10px;
}

.start-btn{
    width:100%;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#00c8ff;
    color:#001018;
    font-size:15px;
    font-weight:bold;
}

.start-btn:disabled{
    background:#252b35;
    color:#666;
}


/* =========================
   DASHBOARD
========================= */

#dashboard{
    display:none;
}

.topbar{
    background:#111722;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.small-title{
    color:#777;
    font-size:11px;
}

.manager-team{
    font-size:25px;
    font-weight:bold;
    margin-top:5px;
}

.season{
    color:#00d9ff;
    font-size:12px;
    margin-top:5px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#111722;
    padding:15px;
    border-radius:12px;
}

.stat-label{
    color:#777;
    font-size:11px;
}

.stat-value{
    font-size:19px;
    font-weight:bold;
    margin-top:5px;
}


/* =========================
   MENU
========================= */

.section{
    background:#111722;
    border-radius:15px;
    padding:17px;
    margin-bottom:15px;
}

.section h2{
    font-size:17px;
    margin-bottom:15px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.menu button{
    padding:15px 8px;
    border-radius:10px;
    background:#1b2330;
    color:white;
    font-weight:bold;
}

.menu button:hover{
    background:#273345;
}


/* =========================
   PAGE
========================= */

.page{
    display:none;
}

.page.active{
    display:block;
}

.back-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    background:#202936;
    color:white;
    margin-bottom:15px;
}


/* =========================
   PLAYER CARD
========================= */

.player-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.player-card{
    background:#151c27;
    border:1px solid #242d3b;
    border-radius:12px;
    padding:14px;
}

.player-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.player-name{
    font-size:16px;
    font-weight:bold;
}

.player-role{
    font-size:11px;
    color:#00d9ff;
    margin-top:5px;
}

.player-rating{
    font-size:18px;
    font-weight:bold;
}

.player-info{
    color:#777;
    font-size:11px;
    margin-top:7px;
}


/* =========================
   LINEUP
========================= */

.lineup-box{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.position{
    background:#151c27;
    border-radius:12px;
    padding:14px;
}

.position-title{
    color:#00d9ff;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

.position select{
    width:100%;
    padding:12px;
    background:#0b1018;
    color:white;
    border:1px solid #303b4c;
    border-radius:8px;
}

.save-lineup{
    width:100%;
    padding:15px;
    border-radius:10px;
    background:#00c8ff;
    color:#001018;
    font-weight:bold;
    margin-top:10px;
}

.lineup-status{
    text-align:center;
    color:#777;
    font-size:12px;
    margin-top:10px;
}


/* =========================
   MATCH
========================= */

.next-match{
    text-align:center;
    padding:20px;
    background:#151c27;
    border-radius:12px;
}

.vs{
    color:#00d9ff;
    font-size:13px;
    font-weight:bold;
    margin:10px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

    .container{
        padding:12px;
    }

    h1{
        font-size:24px;
    }

    .team-name{
        font-size:13px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     PILIH TIM
===================================================== -->

<div id="teamSelect">

    <div class="container">

        <div class="select-box">

            <div class="logo-title">
                MPL WORLD MANAGER
            </div>

            <h1>PILIH TIM</h1>

            <div class="subtitle">
                MPL Indonesia Season 18
            </div>

            <div
                id="teamGrid"
                class="team-grid">
            </div>

            <button
                id="startCareerBtn"
                class="start-btn"
                disabled
                onclick="startCareer()">

                PILIH TIM TERLEBIH DAHULU

            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard">

    <div class="container">

        <div class="topbar">

            <div class="small-title">
                MANAGER CAREER
            </div>

            <div
                id="managerTeamName"
                class="manager-team">
                -
            </div>

            <div class="season">
                MPL INDONESIA — SEASON 18
            </div>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <div class="stat-label">
                    BUDGET
                </div>

                <div
                    id="budget"
                    class="stat-value">
                    Rp 0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    MORAL
                </div>

                <div
                    id="morale"
                    class="stat-value">
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    CHEMISTRY
                </div>

                <div
                    id="chemistry"
                    class="stat-value">
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    REPUTATION
                </div>

                <div
                    id="reputation"
                    class="stat-value">
                    0
                </div>

            </div>

        </div>


        <!-- MANAGER MENU -->

        <div class="section">

            <h2>
                MANAGER MENU
            </h2>

            <div class="menu">

                <button onclick="openPage('rosterPage')">
                    👥 ROSTER
                </button>

                <button onclick="openPage('lineupPage')">
                    ⚔️ LINEUP
                </button>

                <button onclick="comingSoon('Training')">
                    🏋️ TRAINING
                </button>

                <button onclick="comingSoon('Transfer')">
                    🔄 TRANSFER
                </button>

                <button onclick="comingSoon('Scouting')">
                    🔎 SCOUTING
                </button>

                <button onclick="comingSoon('Staff')">
                    🧑‍💼 STAFF
                </button>

                <button onclick="comingSoon('Schedule')">
                    📅 JADWAL
                </button>

                <button onclick="comingSoon('Standings')">
                    🏆 KLASEMEN
                </button>

            </div>

        </div>


        <!-- NEXT MATCH -->

        <div class="section">

            <h2>
                PERTANDINGAN BERIKUTNYA
            </h2>

            <div id="nextMatch">
                Belum ada pertandingan.
            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     ROSTER PAGE
===================================================== -->

<div
    id="rosterPage"
    class="page">

    <div class="container">

        <button
            class="back-btn"
            onclick="backDashboard()">

            ← KEMBALI KE DASHBOARD

        </button>


        <div class="section">

            <h2>
                👥 ROSTER TIM
            </h2>

            <div
                id="rosterList"
                class="player-list">
            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     LINEUP PAGE
===================================================== -->

<div
    id="lineupPage"
    class="page">

    <div class="container">

        <button
            class="back-btn"
            onclick="backDashboard()">

            ← KEMBALI KE DASHBOARD

        </button>


        <div class="section">

            <h2>
                ⚔️ LINEUP UTAMA
            </h2>

            <div
                id="lineupBox"
                class="lineup-box">
            </div>

            <button
                class="save-lineup"
                onclick="saveLineup()">

                💾 SIMPAN LINEUP

            </button>

            <div
                id="lineupStatus"
                class="lineup-status">

                Pilih 5 pemain utama.

            </div>

        </div>

    </div>

</div>



<script src="game.js?v=8"></script>


<script>

/* =====================================================
   VARIABLE
===================================================== */

let selectedTeam = null;


/* =====================================================
   FORMAT UANG
===================================================== */

function formatMoney(value){

    if(!value){
        return "Rp 0";
    }

    if(value >= 1000000000){

        return "Rp " +
            (value / 1000000000)
            .toFixed(1) +
            " M";

    }

    if(value >= 1000000){

        return "Rp " +
            (value / 1000000)
            .toFixed(0) +
            " Jt";

    }

    return "Rp " +
        value.toLocaleString("id-ID");

}


/* =====================================================
   RENDER TIM
===================================================== */

function renderTeams(){

    const grid =
        document.getElementById("teamGrid");

    grid.innerHTML = "";

    if(
        typeof game === "undefined" ||
        !game.teams
    ){

        grid.innerHTML =
            "<p>Database game.js tidak ditemukan.</p>";

        return;

    }


    Object.values(game.teams)
        .forEach(team => {

            const card =
                document.createElement("div");

            card.className =
                "team-card";


            card.innerHTML = `

                <div class="team-name">
                    ${team.name}
                </div>

                <div class="team-region">
                    MPL Indonesia
                </div>

                <div class="team-rating">
                    ⭐ Reputation:
                    ${team.reputation || 0}
                </div>

            `;


            card.onclick = function(){

                document
                    .querySelectorAll(".team-card")
                    .forEach(c =>
                        c.classList.remove("selected")
                    );


                card.classList.add("selected");


                selectedTeam =
                    team.id;


                const btn =
                    document.getElementById(
                        "startCareerBtn"
                    );


                btn.disabled = false;

                btn.innerText =
                    "MULAI KARIER DENGAN " +
                    team.name;

            };


            grid.appendChild(card);

        });

}


/* =====================================================
   START CAREER
===================================================== */

function startCareer(){

    if(!selectedTeam){

        alert(
            "Pilih tim terlebih dahulu!"
        );

        return;

    }


    const team =
        game.teams[selectedTeam];


    if(!team){

        alert(
            "Data tim tidak ditemukan."
        );

        return;

    }


    game.managerTeam =
        selectedTeam;


    game.budget =
        team.budget || 5000000000;


    game.phase =
        "regular";


    game.week =
        1;


    /*
       Buat lineup kosong
       jika belum ada.
    */

    if(!game.lineup){

        game.lineup = {
            exp:null,
            jungler:null,
            mid:null,
            gold:null,
            roamer:null
        };

    }


    saveGameSafe();

    showDashboard();

}


/* =====================================================
   SAVE
===================================================== */

function saveGameSafe(){

    if(
        typeof saveGame === "function"
    ){

        saveGame();

    }else{

        localStorage.setItem(
            "mpl_world_manager",
            JSON.stringify(game)
        );

    }

}


/* =====================================================
   DASHBOARD
===================================================== */

function showDashboard(){

    const team =
        game.teams[game.managerTeam];


    if(!team){
        return;
    }


    document.getElementById(
        "teamSelect"
    ).style.display = "none";


    document.getElementById(
        "dashboard"
    ).style.display = "block";


    document.getElementById(
        "managerTeamName"
    ).innerText =
        team.name;


    document.getElementById(
        "budget"
    ).innerText =
        formatMoney(game.budget);


    document.getElementById(
        "morale"
    ).innerText =
        team.morale || 0;


    document.getElementById(
        "chemistry"
    ).innerText =
        team.chemistry || 0;


    document.getElementById(
        "reputation"
    ).innerText =
        team.reputation || 0;


    renderNextMatch();

}


/* =====================================================
   GET ROSTER MANAGER
===================================================== */

function getManagerRoster(){

    if(
        !game.players ||
        !game.managerTeam
    ){

        return [];

    }


    return Object.values(game.players)
        .filter(player => {

            return player.team ===
                game.managerTeam;

        });

}


/* =====================================================
   ROSTER PAGE
===================================================== */

function renderRoster(){

    const list =
        document.getElementById(
            "rosterList"
        );


    list.innerHTML = "";


    const roster =
        getManagerRoster();


    if(roster.length === 0){

        list.innerHTML = `

            <div class="player-card">

                <div class="player-name">
                    Roster belum tersedia
                </div>

                <div class="player-info">
                    Periksa database game.js.
                </div>

            </div>

        `;

        return;

    }


    roster.forEach(player => {

        const card =
            document.createElement("div");


        card.className =
            "player-card";


        const rating =
            player.rating ||
            player.ovr ||
            player.power ||
            0;


        card.innerHTML = `

            <div class="player-top">

                <div>

                    <div class="player-name">
                        ${player.name}
                    </div>

                    <div class="player-role">
                        ${player.role || "Unknown"}
                    </div>

                </div>

                <div class="player-rating">
                    ${rating}
                </div>

            </div>

            <div class="player-info">
                Status: ${player.status || "Active"}
            </div>

        `;


        list.appendChild(card);

    });

}


/* =====================================================
   LINEUP PAGE
===================================================== */

function renderLineup(){

    const box =
        document.getElementById(
            "lineupBox"
        );


    box.innerHTML = "";


    const roster =
        getManagerRoster();


    const positions = [

        {
            key:"exp",
            label:"EXP LANER",
            role:"EXP"
        },

        {
            key:"jungler",
            label:"JUNGLER",
            role:"Jungler"
        },

        {
            key:"mid",
            label:"MID LANER",
            role:"Mid"
        },

        {
            key:"gold",
            label:"GOLD LANER",
            role:"Gold"
        },

        {
            key:"roamer",
            label:"ROAMER",
            role:"Roamer"
        }

    ];


    positions.forEach(position => {

        const wrapper =
            document.createElement("div");


        wrapper.className =
            "position";


        const title =
            document.createElement("div");


        title.className =
            "position-title";


        title.innerText =
            position.label;


        const select =
            document.createElement("select");


        select.id =
            "lineup_" +
            position.key;


        const empty =
            document.createElement("option");


        empty.value = "";

        empty.innerText =
            "-- PILIH PEMAIN --";


        select.appendChild(empty);


        roster.forEach(player => {

            if(
                normalizeRole(player.role) ===
                normalizeRole(position.role)
            ){

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    player.id;


                option.innerText =
                    player.name;


                select.appendChild(
                    option
                );

            }

        });


        /*
           Kalau role tidak cocok,
           tampilkan pemain juga.
           Ini membuat lineup tetap
           bisa dipakai dengan database
           yang role-nya berbeda format.
        */

        if(select.options.length === 1){

            roster.forEach(player => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    player.id;


                option.innerText =
                    player.name +
                    " (" +
                    (player.role || "?") +
                    ")";


                select.appendChild(
                    option
                );

            });

        }


        if(
            game.lineup &&
            game.lineup[position.key]
        ){

            select.value =
                game.lineup[
                    position.key
                ];

        }


        wrapper.appendChild(title);

        wrapper.appendChild(select);

        box.appendChild(wrapper);

    });

}


/* =====================================================
   NORMALIZE ROLE
===================================================== */

function normalizeRole(role){

    if(!role){
        return "";
    }


    role =
        role
        .toString()
        .toLowerCase()
        .trim();


    if(
        role.includes("jungle")
    ){
        return "jungler";
    }


    if(
        role.includes("mid")
    ){
        return "mid";
    }


    if(
        role.includes("gold")
    ){
        return "gold";
    }


    if(
        role.includes("roam")
    ){
        return "roamer";
    }


    if(
        role.includes("exp")
    ){
        return "exp";
    }


    return role;

}


/* =====================================================
   SIMPAN LINEUP
===================================================== */

function saveLineup(){

    const positions = [
        "exp",
        "jungler",
        "mid",
        "gold",
        "roamer"
    ];


    if(!game.lineup){

        game.lineup = {};

    }


    let selected = [];


    positions.forEach(position => {

        const select =
            document.getElementById(
                "lineup_" + position
            );


        game.lineup[position] =
            select.value || null;


        if(select.value){

            selected.push(
                select.value
            );

        }

    });


    /*
       Cek pemain yang sama
       dipakai lebih dari sekali.
    */

    const unique =
        new Set(selected);


    const status =
        document.getElementById(
            "lineupStatus"
        );


    if(unique.size !== selected.length){

        status.innerText =
            "⚠️ Satu pemain tidak boleh mengisi dua posisi.";

        return;

    }


    if(selected.length < 5){

        status.innerText =
            "⚠️ Pilih 5 pemain terlebih dahulu.";

        return;

    }


    saveGameSafe();


    status.innerText =
        "✅ LINEUP BERHASIL DISIMPAN!";


    setTimeout(() => {

        status.innerText =
            "Lineup siap digunakan untuk pertandingan.";

    },2000);

}


/* =====================================================
   OPEN PAGE
===================================================== */

function openPage(pageId){

    document.getElementById(
        "dashboard"
    ).style.display = "none";


    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove(
                "active"
            );

        });


    document.getElementById(
        pageId
    ).classList.add("active");


    if(pageId === "rosterPage"){

        renderRoster();

    }


    if(pageId === "lineupPage"){

        renderLineup();

    }

}


/* =====================================================
   BACK DASHBOARD
===================================================== */

function backDashboard(){

    document
        .querySelectorAll(".page")
        .forEach(page => {

            page.classList.remove(
                "active"
            );

        });


    document.getElementById(
        "dashboard"
    ).style.display = "block";

}


/* =====================================================
   NEXT MATCH
===================================================== */

function renderNextMatch(){

    const box =
        document.getElementById(
            "nextMatch"
        );


    if(
        !game.schedule ||
        !Array.isArray(game.schedule)
    ){

        box.innerHTML =
            "Jadwal belum tersedia.";

        return;

    }


    const match =
        game.schedule.find(m => {

            return !m.played &&
            (
                m.home ===
                game.managerTeam
                ||
                m.away ===
                game.managerTeam
            );

        });


    if(!match){

        box.innerHTML =
            "Belum ada pertandingan.";

        return;

    }


    const home =
        game.teams[match.home];


    const away =
        game.teams[match.away];


    if(!home || !away){

        box.innerHTML =
            "Data pertandingan belum lengkap.";

        return;

    }


    box.innerHTML = `

        <div class="next-match">

            <div>
                WEEK ${match.week || 1}
            </div>

            <br>

            <strong>
                ${home.name}
            </strong>

            <div class="vs">
                VS
            </div>

            <strong>
                ${away.name}
            </strong>

            <br><br>

            <button
                onclick="comingSoon('Match Engine')"
                style="
                    padding:12px 20px;
                    border-radius:8px;
                    background:#00c8ff;
                    font-weight:bold;
                ">

                MAINKAN MATCH

            </button>

        </div>

    `;

}


/* =====================================================
   COMING SOON
===================================================== */

function comingSoon(name){

    alert(
        name +
        " akan kita bangun setelah sistem dasar selesai 🔥"
    );

}


/* =====================================================
   LOAD CAREER
===================================================== */

function loadCareer(){

    if(
        typeof game === "undefined"
    ){

        alert(
            "game.js tidak ditemukan."
        );

        return;

    }


    if(game.managerTeam){

        selectedTeam =
            game.managerTeam;

        showDashboard();

    }else{

        renderTeams();

    }

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderTeams();

        loadCareer();

    }
);

</script>

</body>
</html>
