<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MPL World Manager</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #171b25;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            color: #aaa;
        }

        .container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: #191e29;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .card h2 {
            margin-top: 0;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .card p {
            color: #ccc;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #f5c542;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>🌍 MPL World Manager</h1>
        <p>Esports Management Simulator</p>
    </header>


    <!-- ISI GAME -->
    <div class="container">

        <!-- DAFTAR REGION DAN LIGA -->
        <div id="leagueList"></div>


        <!-- PERTANDINGAN -->
        <div class="card">

            <h2>⚔️ Pertandingan</h2>

            <p id="match">
                RRQ vs ONIC
            </p>

            <button onclick="mainMatch()">
                MAINKAN MATCH
            </button>

            <p id="result"></p>

        </div>

    </div>


    <!-- MATCH ENGINE -->
    <script>

        function mainMatch() {

            const rrq = 85;
            const onic = 88;

            const rrqPower = rrq + Math.random() * 20;
            const onicPower = onic + Math.random() * 20;

            const result = document.getElementById("result");

            if (rrqPower > onicPower) {

                result.innerHTML = "🏆 RRQ MENANG!";

            } else {

                result.innerHTML = "🏆 ONIC MENANG!";

            }
        }

    </script>


    <!-- DATABASE GAME -->
    <script src="game.js"></script>

</body>

</html>
