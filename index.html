<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MPL World Manager</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #171b25;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            color: #aaa;
        }

        .container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: #191e29;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .card h2 {
            margin-top: 0;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .card p {
            color: #ccc;
            line-height: 1.5;
        }

        .player {
            background: #222936;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .player-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .player-info {
            color: #bbb;
            line-height: 1.7;
            font-size: 14px;
        }

        .rating {
            font-size: 22px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #f5c542;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>🌍 MPL World Manager</h1>
        <p>Esports Management Simulator</p>
    </header>


    <div class="container">

        <!-- REGION DAN LIGA -->
        <div id="leagueList"></div>


        <!-- ROSTER RRQ -->
        <div class="card">

            <h2>👑 RRQ — Roster</h2>

            <div id="rrqRoster"></div>

        </div>


        <!-- PERTANDINGAN -->
        <div class="card">

            <h2>⚔️ Pertandingan</h2>

            <p id="match">
                RRQ vs ONIC
            </p>

            <button onclick="mainMatch()">
                MAINKAN MATCH
            </button>

            <p id="result"></p>

        </div>

    </div>


    <!-- MATCH ENGINE -->
    <script>

        function mainMatch() {

            const rrq = 85;
            const onic = 88;

            const rrqPower = rrq + Math.random() * 20;
            const onicPower = onic + Math.random() * 20;

            const result = document.getElementById("result");

            if (rrqPower > onicPower) {

                result.innerHTML = "🏆 RRQ MENANG!";

            } else {

                result.innerHTML = "🏆 ONIC MENANG!";

            }
        }


        // ========================================
        // TAMPILKAN ROSTER RRQ
        // ========================================

        function tampilkanRosterRRQ() {

            const container = document.getElementById("rrqRoster");

            container.innerHTML = "";

            for (const id in game.players) {

                const player = game.players[id];

                if (player.team !== "RRQ") {
                    continue;
                }

                const playerBox = document.createElement("div");

                playerBox.className = "player";

                playerBox.innerHTML = `
                    <div class="player-name">
                        👤 ${player.name}
                    </div>

                    <div class="player-info">

                        🎯 Role: ${player.role}<br>

                        🎂 Umur: ${player.age} tahun<br>

                        ⭐ Rating:
                        <span class="rating">
                            ${player.rating}
                        </span>
                        <br>

                        📈 Potential: ${player.potential}<br>

                        💰 Gaji:
                        Rp ${player.salary.toLocaleString("id-ID")}
                        / bulan<br>

                        😊 Morale: ${player.morale}

                    </div>
                `;

                container.appendChild(playerBox);
            }
        }


        // ========================================
        // START GAME
        // ========================================

        document.addEventListener("DOMContentLoaded", function() {

            tampilkanRosterRRQ();

        });

    </script>


    <!-- DATABASE GAME -->
    <script src="game.js"></script>

</body>

</html>
