<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPL World Manager</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080b12;
    color:white;
    min-height:100vh;
}

button{
    border:none;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* =========================
   PILIH TIM
========================= */

#teamSelect{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.select-box{
    width:100%;
    text-align:center;
}

.logo-title{
    font-size:14px;
    color:#888;
    letter-spacing:3px;
    margin-bottom:10px;
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    color:#999;
    margin-bottom:25px;
}

.team-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.team-card{
    background:#111722;
    border:2px solid #202938;
    border-radius:14px;
    padding:18px 10px;
    transition:.2s;
}

.team-card:hover{
    transform:translateY(-2px);
    border-color:#555;
}

.team-card.selected{
    border-color:#00e5ff;
    background:#10202a;
}

.team-name{
    font-size:17px;
    font-weight:bold;
}

.team-region{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

.team-rating{
    margin-top:10px;
    font-size:12px;
    color:#aaa;
}

.start-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    border-radius:12px;
    background:#00c8ff;
    color:#001018;
    font-weight:bold;
    font-size:16px;
}

.start-btn:disabled{
    background:#252b35;
    color:#666;
    cursor:not-allowed;
}

/* =========================
   DASHBOARD
========================= */

#dashboard{
    display:none;
}

.topbar{
    background:#111722;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.small-title{
    color:#888;
    font-size:12px;
}

.manager-team{
    font-size:25px;
    font-weight:bold;
    margin-top:5px;
}

.season{
    color:#00d9ff;
    font-size:13px;
    margin-top:5px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#111722;
    padding:15px;
    border-radius:12px;
}

.stat-label{
    color:#777;
    font-size:12px;
}

.stat-value{
    font-size:20px;
    font-weight:bold;
    margin-top:5px;
}

.section{
    background:#111722;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.section h2{
    font-size:17px;
    margin-bottom:15px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.menu button{
    padding:15px 10px;
    border-radius:10px;
    background:#1b2330;
    color:white;
    font-weight:bold;
}

.menu button:hover{
    background:#273345;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #202633;
}

.info-row:last-child{
    border-bottom:none;
}

.muted{
    color:#777;
}

.danger{
    color:#ff5b5b;
}

.change-team{
    margin-top:15px;
    width:100%;
    padding:12px;
    background:#222936;
    color:#aaa;
    border-radius:10px;
}

/* MOBILE */

@media(max-width:500px){
    .container{
        padding:15px;
    }

    h1{
        font-size:25px;
    }

    .team-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .team-card{
        padding:15px 8px;
    }

    .team-name{
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     HALAMAN PILIH TIM
===================================================== -->

<div id="teamSelect">
    <div class="container">
        <div class="select-box">

            <div class="logo-title">
                MPL WORLD MANAGER
            </div>

            <h1>PILIH TIM</h1>

            <div class="subtitle">
                MPL Indonesia Season 18
            </div>

            <div id="teamGrid" class="team-grid"></div>

            <button
                id="startCareerBtn"
                class="start-btn"
                disabled
                onclick="startCareer()">
                PILIH TIM TERLEBIH DAHULU
            </button>

        </div>
    </div>
</div>


<!-- =====================================================
     DASHBOARD MANAGER
===================================================== -->

<div id="dashboard">

    <div class="container">

        <div class="topbar">
            <div class="small-title">
                MANAGER CAREER
            </div>

            <div id="managerTeamName" class="manager-team">
                -
            </div>

            <div class="season">
                MPL INDONESIA — SEASON 18
            </div>
        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">
                <div class="stat-label">BUDGET</div>
                <div id="budget" class="stat-value">Rp 0</div>
            </div>

            <div class="stat">
                <div class="stat-label">MORAL</div>
                <div id="morale" class="stat-value">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">CHEMISTRY</div>
                <div id="chemistry" class="stat-value">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">REPUTATION</div>
                <div id="reputation" class="stat-value">0</div>
            </div>

        </div>


        <!-- MENU MANAGER -->

        <div class="section">

            <h2>MANAGER MENU</h2>

            <div class="menu">

                <button onclick="comingSoon('Roster')">
                    👥 ROSTER
                </button>

                <button onclick="comingSoon('Lineup')">
                    ⚔️ LINEUP
                </button>

                <button onclick="comingSoon('Training')">
                    🏋️ TRAINING
                </button>

                <button onclick="comingSoon('Transfers')">
                    🔄 TRANSFER
                </button>

                <button onclick="comingSoon('Scouting')">
                    🔎 SCOUTING
                </button>

                <button onclick="comingSoon('Staff')">
                    🧑‍💼 STAFF
                </button>

                <button onclick="comingSoon('Schedule')">
                    📅 JADWAL
                </button>

                <button onclick="comingSoon('Standings')">
                    🏆 KLASEMEN
                </button>

            </div>

        </div>


        <!-- INFO TIM -->

        <div class="section">

            <h2>INFORMASI TIM</h2>

            <div class="info-row">
                <span class="muted">Status</span>
                <span>Manager</span>
            </div>

            <div class="info-row">
                <span class="muted">Liga</span>
                <span>MPL Indonesia</span>
            </div>

            <div class="info-row">
                <span class="muted">Season</span>
                <span>18</span>
            </div>

            <div class="info-row">
                <span class="muted">Fase</span>
                <span>Regular Season</span>
            </div>

        </div>


        <!-- UPCOMING MATCH -->

        <div class="section">

            <h2>PERTANDINGAN BERIKUTNYA</h2>

            <div id="nextMatch">
                Belum ada jadwal pertandingan.
            </div>

        </div>


        <button
            class="change-team"
            onclick="changeTeam()">
            GANTI TIM / RESET CAREER
        </button>

    </div>

</div>


<script src="game.js?v=7"></script>

<script>

/* =====================================================
   VARIABEL
===================================================== */

let selectedTeam = null;


/* =====================================================
   FORMAT UANG
===================================================== */

function formatMoney(value){

    if(value >= 1000000000){
        return "Rp " + (value / 1000000000).toFixed(1) + " M";
    }

    if(value >= 1000000){
        return "Rp " + (value / 1000000).toFixed(0) + " Jt";
    }

    return "Rp " + value.toLocaleString("id-ID");
}


/* =====================================================
   TAMPILKAN SEMUA TIM
===================================================== */

function renderTeams(){

    const grid = document.getElementById("teamGrid");

    grid.innerHTML = "";

    if(!game || !game.teams){
        grid.innerHTML =
            "<p>Database tim belum ditemukan.</p>";
        return;
    }

    Object.values(game.teams).forEach(team => {

        const card = document.createElement("div");

        card.className = "team-card";

        card.innerHTML = `
            <div class="team-name">
                ${team.name}
            </div>

            <div class="team-region">
                MPL Indonesia
            </div>

            <div class="team-rating">
                ⭐ Reputation: ${team.reputation || 0}
            </div>
        `;

        card.onclick = function(){

            document
                .querySelectorAll(".team-card")
                .forEach(c => c.classList.remove("selected"));

            card.classList.add("selected");

            selectedTeam = team.id;

            const btn =
                document.getElementById("startCareerBtn");

            btn.disabled = false;

            btn.innerText =
                "MULAI KARIER DENGAN " + team.name;
        };

        grid.appendChild(card);

    });
}


/* =====================================================
   MULAI KARIER
===================================================== */

function startCareer(){

    if(!selectedTeam){
        alert("Pilih tim terlebih dahulu!");
        return;
    }

    const team = game.teams[selectedTeam];

    if(!team){
        alert("Tim tidak ditemukan.");
        return;
    }

    /*
      Hanya tim yang dipilih menjadi tim manager.
      Tim lainnya tetap AI.
    */

    game.managerTeam = selectedTeam;

    game.budget =
        team.budget || 5000000000;

    game.phase = "regular";

    game.week = 1;

    if(typeof saveGame === "function"){
        saveGame();
    }else{
        localStorage.setItem(
            "mpl_world_manager",
            JSON.stringify(game)
        );
    }

    showDashboard();

}


/* =====================================================
   DASHBOARD
===================================================== */

function showDashboard(){

    const team =
        game.teams[game.managerTeam];

    if(!team){
        return;
    }

    document.getElementById("teamSelect")
        .style.display = "none";

    document.getElementById("dashboard")
        .style.display = "block";


    document.getElementById("managerTeamName")
        .innerText = team.name;


    document.getElementById("budget")
        .innerText =
        formatMoney(game.budget);


    document.getElementById("morale")
        .innerText =
        team.morale || 0;


    document.getElementById("chemistry")
        .innerText =
        team.chemistry || 0;


    document.getElementById("reputation")
        .innerText =
        team.reputation || 0;


    renderNextMatch();

}


/* =====================================================
   MATCH BERIKUTNYA
===================================================== */

function renderNextMatch(){

    const box =
        document.getElementById("nextMatch");

    if(!game.schedule ||
       !Array.isArray(game.schedule)){

        box.innerHTML =
            "Jadwal pertandingan belum tersedia.";

        return;
    }

    const teamId =
        game.managerTeam;

    const match =
        game.schedule.find(m => {

            return !m.played &&
            (m.home === teamId ||
             m.away === teamId);

        });


    if(!match){

        box.innerHTML =
            "Tidak ada pertandingan berikutnya.";

        return;
    }


    const home =
        game.teams[match.home];

    const away =
        game.teams[match.away];


    if(!home || !away){

        box.innerHTML =
            "Data pertandingan belum lengkap.";

        return;
    }


    box.innerHTML = `

        <div style="
            text-align:center;
            padding:15px;
            background:#1b2330;
            border-radius:12px;
        ">

            <div style="
                color:#777;
                font-size:12px;
                margin-bottom:8px;
            ">
                WEEK ${match.week || 1}
            </div>

            <strong>
                ${home.name}
            </strong>

            <div style="
                margin:8px;
                color:#00d9ff;
                font-weight:bold;
            ">
                VS
            </div>

            <strong>
                ${away.name}
            </strong>

            <br><br>

            <button
                onclick="comingSoon('Match')"
                style="
                    margin-top:10px;
                    padding:12px 25px;
                    border-radius:8px;
                    background:#00c8ff;
                    font-weight:bold;
                ">
                KE PERTANDINGAN
            </button>

        </div>

    `;

}


/* =====================================================
   MENU SEMENTARA
===================================================== */

function comingSoon(name){

    alert(
        name +
        " akan kita bangun pada tahap berikutnya 🔥"
    );

}


/* =====================================================
   GANTI TIM
===================================================== */

function changeTeam(){

    const yakin =
        confirm(
            "Ganti tim akan menghapus karier saat ini. Lanjut?"
        );

    if(!yakin){
        return;
    }

    localStorage.removeItem(
        "mpl_world_manager"
    );

    location.reload();

}


/* =====================================================
   LOAD CAREER
===================================================== */

function loadCareer(){

    if(!game){
        return;
    }

    if(game.managerTeam){

        selectedTeam =
            game.managerTeam;

        showDashboard();

    }else{

        renderTeams();

    }

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderTeams();

        loadCareer();

    }
);

</script>

</body>
</html>
