<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MPL World Manager</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #171b25;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            color: #aaa;
        }

        .container {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: #191e29;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .league-team {
            background: #222936;
            padding: 14px;
            margin-top: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .league-team:hover {
            transform: scale(1.02);
        }

        .player {
            background: #222936;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .player-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .player-info {
            color: #bbb;
            line-height: 1.7;
            font-size: 14px;
        }

        .rating {
            font-size: 22px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #f5c542;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        .back-button {
            background: #303642;
            color: white;
        }

        #result {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌍 MPL World Manager</h1>
        <p>Esports Management Simulator</p>
    </header>


    <div class="container">

        <!-- HALAMAN LIGA -->
        <div id="leaguePage">

            <div id="leagueList"></div>

        </div>


        <!-- HALAMAN ROSTER -->
        <div id="rosterPage" style="display: none;">

            <div class="card">

                <button class="back-button" onclick="kembaliKeLiga()">
                    ← KEMBALI KE LIGA
                </button>

                <h2 id="rosterTitle">
                    Roster
                </h2>

                <div id="rosterList"></div>

            </div>

        </div>


        <!-- PERTANDINGAN -->
        <div class="card">

            <h2>⚔️ Pertandingan</h2>

            <p id="match">
                RRQ vs ONIC
            </p>

            <button onclick="mainMatch()">
                MAINKAN MATCH
            </button>

            <p id="result"></p>

        </div>

    </div>


    <!-- GAME SCRIPT -->

    <script src="game.js"></script>


    <!-- UI SCRIPT -->

    <script>

        // ========================================
        // TAMPILKAN SEMUA LIGA
        // ========================================

        function tampilkanSemuaLiga() {

            const container = document.getElementById("leagueList");

            container.innerHTML = "";

            for (const id in game.regions) {

                const region = game.regions[id];

                const regionBox = document.createElement("div");

                regionBox.className = "card";

                let html = `
                    <h2>🌍 ${region.name}</h2>

                    <h3>🏆 ${region.tier1.name}</h3>
                `;

                region.tier1.teams.forEach(function(team) {

                    html += `
                        <div
                            class="league-team"
                            onclick="bukaRoster('${team}')"
                        >
                            🏆 ${team}
                        </div>
                    `;

                });


                html += `
                    <h3>🥈 ${region.tier2.name}</h3>
                `;


                region.tier2.teams.forEach(function(team) {

                    html += `
                        <div
                            class="league-team"
                            onclick="bukaRoster('${team}')"
                        >
                            🥈 ${team}
                        </div>
                    `;

                });


                regionBox.innerHTML = html;

                container.appendChild(regionBox);

            }

        }


        // ========================================
        // BUKA ROSTER
        // ========================================

        function bukaRoster(teamName) {

            document.getElementById("leaguePage").style.display = "none";

            document.getElementById("rosterPage").style.display = "block";

            document.getElementById("rosterTitle").innerHTML =
                "👑 " + teamName + " — Roster";

            const rosterList =
                document.getElementById("rosterList");

            rosterList.innerHTML = "";


            let jumlahPemain = 0;


            for (const id in game.players) {

                const player = game.players[id];


                if (player.team === teamName) {

                    jumlahPemain++;


                    const playerBox =
                        document.createElement("div");

                    playerBox.className = "player";


                    playerBox.innerHTML = `

                        <div class="player-name">
                            👤 ${player.name}
                        </div>

                        <div class="player-info">

                            🎯 Role:
                            ${player.role}
                            <br>

                            🎂 Umur:
                            ${player.age} tahun
                            <br>

                            ⭐ Rating:
                            <span class="rating">
                                ${player.rating}
                            </span>
                            <br>

                            📈 Potential:
                            ${player.potential}
                            <br>

                            💰 Gaji:
                            Rp ${player.salary.toLocaleString("id-ID")}
                            / bulan
                            <br>

                            😊 Morale:
                            ${player.morale}

                        </div>
                    `;


                    rosterList.appendChild(playerBox);

                }

            }


            if (jumlahPemain === 0) {

                rosterList.innerHTML = `
                    <p>
                        Belum ada data pemain untuk tim ini.
                    </p>
                `;

            }

        }


        // ========================================
        // KEMBALI KE LIGA
        // ========================================

        function kembaliKeLiga() {

            document.getElementById("rosterPage").style.display = "none";

            document.getElementById("leaguePage").style.display = "block";

        }


        // ========================================
        // MATCH
        // ========================================

        function mainMatch() {

            const rrq = 85;

            const onic = 88;

            const rrqPower =
                rrq + Math.random() * 20;

            const onicPower =
                onic + Math.random() * 20;

            const result =
                document.getElementById("result");


            if (rrqPower > onicPower) {

                result.innerHTML =
                    "🏆 RRQ MENANG!";

            } else {

                result.innerHTML =
                    "🏆 ONIC MENANG!";

            }

        }


        // ========================================
        // START
        // ========================================

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                tampilkanSemuaLiga();

            }
        );

    </script>

</body>

</html>
