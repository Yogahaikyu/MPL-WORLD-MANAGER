h2{

h3{

.money{

.warning{

.center{

.big-title{

.role{

}

.small{

  color:#aab3c9;
}

hr{

  margin:18px 0;
}

.empty{
  padding:30px;
  text-align:center;
  color:#aab3c9;
}

.progress{
  width:100%;
  height:10px;
  background:#252d44;
  border-radius:20px;
  overflow:hidden;
  margin-top:6px;
}

.progress div{
  height:100%;
  background:#5865f2;
}

select{
  padding:11px;
  border-radius:8px;
  background:#202a45;
  color:white;
  border:1px solid #3b4768;
}

@media(max-width:600px){
  .big-title{
    font-size:32px;
  }

  }

/* =====================================================
   UTILITIES
   ===================================================== */

function money(value){

  return new Intl.NumberFormat("id-ID",{
    style:"currency",
    currency:"IDR",
    maximumFractionDigits:0
  }).format(value);

}

function getOrg(){

  if(!career) return null;

  const country = WORLD[career.country];

  if(!country) return null;

  const league = country.leagues[career.league];

  if(!league) return null;

  return league.organizations.find(
    o => o.id === career.organizationId
  );

}

function getTeam(teamId){

  const org = getOrg();

  if(!org) return null;

  return org.teams.find(
    t => t.id === teamId
  );

}

function getCurrentTeam(){

  return getTeam(career.currentTeamId);

}

function getRoster(teamId){

  if(!career.players[teamId]){
    career.players[teamId] = [];
  }

  return career.players[teamId];

}

function save(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(career)
  );

}

function load(){

  const data =
    localStorage.getItem(SAVE_KEY);

  if(!data) return false;

  try{

    career = JSON.parse(data);

    migrateCareer();

    return true;

  }catch(e){

    return false;

  }

}


/* =====================================================
   MIGRATION
   ===================================================== */

function migrateCareer(){

  if(!career.players)
    career.players = {};

  if(!career.lineups)
    career.lineups = {};

  if(!career.trainingUsed)
    career.trainingUsed = false;

  if(!career.week)
    career.week = 1;

  if(!career.budget)
    career.budget = 1000000000;

  if(!career.morale)
    career.morale = 75;

  if(!career.chemistry)
    career.chemistry = 70;

  if(!career.contracts)
    career.contracts = {};

  Object.keys(career.players).forEach(teamId=>{

    career.players[teamId].forEach(p=>{

      if(p.stamina === undefined)
        p.stamina = 100;

      if(p.form === undefined)
        p.form = 75;

      if(p.salary === undefined)
        p.salary =
          Math.max(
            3000000,
            Math.round(p.ovr * 100000)
          );

      if(p.contractYears === undefined)
        p.contractYears = 2;

      if(p.transferValue === undefined)
        p.transferValue =
          Math.round(
            p.ovr * p.ovr * 100000
          );

    });

  });

  save();

}


/* =====================================================
   CREATE CAREER
   ===================================================== */

function createCareer(
  country,
  league,
  organizationId,
  teamId
){

  career = {

    country,
    league,

    organizationId,

    currentTeamId:teamId,

    week:1,

    season:18,

    budget:1000000000,

    morale:75,

    chemistry:70,

    trainingUsed:false,

    players:{},

    lineups:{},

    contracts:{},

    history:[]

  };

  initializeRosters();

  save();

  dashboard();

}


function initializeRosters(){

  const org = getOrg();

  if(!org) return;

  org.teams.forEach(team=>{

    if(!career.players[team.id]){

      const base =
        BASE_ROSTERS[team.id] || [];

      career.players[team.id] =
        base.map((p,index)=>({

          id:
            team.id+"_"+index+"_"+Date.now(),

          name:p[0],

          role:p[1],

          ovr:p[2],

          potential:p[3],

          stamina:100,

          form:75,

          salary:
            Math.round(p[2]*100000),

          contractYears:2,

          transferValue:
            Math.round(
              p[2]*p[2]*100000
            )

        }));

    }

  });

}

  app.innerHTML = html;

}


/* =====================================================

  country,
  league,
  organizationId
){

  const org =
    WORLD[country]
      .leagues[league]
      .organizations
      .find(o=>o.id===organizationId);

  let html = `

  <div class="container">

    <h2>👕 Pilih Tim</h2>

    <p>
      Kamu akan menjadi manager organisasi
      <b>${org.name}</b>.
    </p>

    <div class="grid">

  `;

  org.teams.forEach(team=>{

    html += `

      <div class="team-card">

        <h3>${team.name}</h3>

        <span class="stat">
          Tier ${team.tier}
        </span>

        <br>

        <button onclick="startSelectedCareer(
          '${country}',
          '${league}',
          '${organizationId}',
          '${team.id}'
        )">
          Mulai Karier
        </button>

      </div>

    `;

  });

  html += `

    </div>

  </div>

  `;

  app.innerHTML = html;

}

    html += `

      <div class="team-card">

        <span class="stat">

  html += `

  app.innerHTML = html;

}

          ⚡ ${p.stamina}
        </div>

        <div class="stat">
          😊 ${p.form}
        </div>

        <hr>

        <div class="small">
          Gaji:
          <span class="money">
            ${money(p.salary)}
          </span>
          / minggu
        </div>

        <div class="small">
          Kontrak:
          ${p.contractYears} tahun
        </div>

        <button
          onclick="addToLineup(${index})"
          class="green">
          Masukkan Lineup
        </button>

        <button
          onclick="releasePlayer(${index})"
          class="danger">
          Lepas
        </button>

      </div>

    `;

  });

  html += `

    </div>

    <hr>

    <h2>⭐ Starting Lineup</h2>

    ${renderLineup()}

  </div>

  `;

  app.innerHTML = html;

}


function renderLineup(){

  const team =
    getCurrentTeam();

  const roster =
    getRoster(team.id);

  const lineup =
    career.lineups[team.id] || {};

  const roles =
    ["EXP","JUNGLE","MID","GOLD","ROAM"];

  let html = "";

  roles.forEach(role=>{

    const index =
      lineup[role];

    let playerName =
      "Belum diisi";

    if(
      index !== undefined &&
      roster[index]
    ){

      playerName =
        roster[index].name+
        " — OVR "+
        roster[index].ovr;

    }

    html += `

      <div class="card">

        <b>${role}</b>

        <br>

        ${playerName}

      </div>

    `;

  });

  return html;

}


function addToLineup(index){

  const team =
    getCurrentTeam();

  const roster =
    getRoster(team.id);

  const player =
    roster[index];

  if(!career.lineups[team.id])
    career.lineups[team.id]={};

  career.lineups[team.id][player.role] =
    index;

  save();

  rosterScreen();

}

function trainingScreen(){

  let html = header()+`

  `;

  TRAINING.forEach((t,index)=>{

        </p>

        </p>

          ${t.stamina >= 0 ? "+" : ""}
          ${t.stamina}
        </p>

        <p>
          OVR:
          +${t.ovr}
        </p>

        <button
          onclick="doTraining(${index})"
          ${career.trainingUsed ? "disabled" : ""}>
          ${career.trainingUsed
            ? "Sudah Training"
            : "Pilih Training"}
        </button>

      </div>

    `;

  });

  html += `

    </div>

  </div>

  `;

  app.innerHTML = html;

}


function doTraining(index){

  if(career.trainingUsed){

    alert(
      "Training minggu ini sudah digunakan."
    );

    return;

  }

  const t =
    TRAINING[index];

  if(career.budget < t.price){

    alert("Budget tidak cukup!");

    return;

  }

  const team =
    getCurrentTeam();

  const roster =
    getRoster(team.id);

  career.budget -=
    t.price;

  career.morale +=
    t.morale;

  career.chemistry +=
    t.chemistry;

  career.morale =
    Math.max(
      0,
      Math.min(100,career.morale)
    );

  career.chemistry =
    Math.max(
      0,
      Math.min(100,career.chemistry)
    );

  roster.forEach(p=>{

    p.stamina =
      Math.max(
        0,
        Math.min(
          100,
          p.stamina+t.stamina
        )
      );

    p.ovr =
      Math.min(
        p.potential,
        p.ovr+t.ovr
      );

  });

  career.trainingUsed = true;

  save();

  alert(
    t.name+
    " berhasil dilakukan!"
  );

  trainingScreen();

}

function isPlayerSigned(id){

  for(const teamId in career.players){

    const found =
      career.players[teamId]
        .find(p=>p.marketId===id);

    if(found)
      return true;

  }

  return false;

}


function signPlayer(id){

  const marketPlayer =
    MARKET_PLAYERS.find(
      p=>p.id===id
    );

  if(!marketPlayer)
    return;

  const team =
    getCurrentTeam();

  const roster =
    getRoster(team.id);

  if(roster.length >= 12){

    alert(
      "Roster sudah penuh! Maksimal 12 pemain."
    );

    return;

  }

  if(isPlayerSigned(id)){

    alert(
      "Pemain ini sudah dikontrak."
    );

    return;

  }

  const select =
    document.getElementById(
      "contract_"+id
    );

  const years =
    Number(select.value);

  if(career.budget <
     marketPlayer.price){

    alert(
      "Budget tidak cukup untuk transfer ini!"
    );

    return;

  }

  const player = {

    id:
      "signed_"+id+"_"+Date.now(),

    marketId:id,

    name:marketPlayer.name,

    role:marketPlayer.role,

    ovr:marketPlayer.ovr,

    potential:marketPlayer.potential,

    stamina:100,

    form:75,

    salary:marketPlayer.salary,

    contractYears:years,

    transferValue:
      marketPlayer.price

  };

  career.budget -=
    marketPlayer.price;

  roster.push(player);

  career.contracts[player.id]={
    playerId:player.id,
    years:years,
    salary:player.salary
  };

  career.history.push({

    type:"transfer_in",

    player:player.name,

    team:team.name,

    fee:marketPlayer.price,

    week:career.week

  });

  save();

  alert(
    player.name+
    " berhasil direkrut!"
  );

  transferScreen();

}


/* =====================================================
   RELEASE PLAYER
   ===================================================== */

function releasePlayer(index){

  const team =
    getCurrentTeam();

  const roster =
    getRoster(team.id);

  const player =
    roster[index];

  if(!player)
    return;

  const confirmRelease =
    confirm(
      "Lepas "+player.name+"?"
    );

  if(!confirmRelease)
    return;

  const releaseFee =
    Math.round(
      player.salary * 4
    );

  if(career.budget <
     releaseFee){

    alert(
      "Budget tidak cukup untuk membayar release fee."
    );

    return;

  }

  career.budget -=
    releaseFee;

  delete career.contracts[player.id];

  if(career.lineups[team.id]){

    Object.keys(
      career.lineups[team.id]
    ).forEach(role=>{

      if(
        career.lineups[team.id][role] ===
        index
      ){

        delete career.lineups[team.id][role];

      }

    });

  }

  roster.splice(index,1);

  /* perbaiki index lineup */

  if(career.lineups[team.id]){

    Object.keys(
      career.lineups[team.id]
    ).forEach(role=>{

      const oldIndex =
        career.lineups[team.id][role];

      if(oldIndex > index){

        career.lineups[team.id][role] =
          oldIndex-1;

      }

    });

  }

  career.history.push({

    type:"transfer_out",

    player:player.name,

    team:team.name,

    fee:releaseFee,

    week:career.week

  });

  save();

  alert(
    player.name+
    " dilepas."
  );

  rosterScreen();

}

        ▶ Advance Week
      </button>

function advanceWeek(){

  const org =
    getOrg();

  let payroll = 0;

  org.teams.forEach(team=>{

    const roster =
      getRoster(team.id);

    roster.forEach(player=>{

      payroll +=
        player.salary;

      player.stamina =
        Math.min(
          100,
          player.stamina+10
        );

      player.form =
        Math.min(
          100,
          player.form+1
        );

    });

  });

  if(career.budget <
     payroll){

    alert(
      "Budget tidak cukup untuk membayar payroll minggu ini!\n\n"+
      "Payroll: "+money(payroll)
    );

    return;

  }

  career.budget -=
    payroll;

  career.week++;

  career.trainingUsed =
    false;

  /* setiap 18 minggu masuk season baru */

  if(career.week > 18){

    career.week = 1;

    career.season++;

    Object.keys(
      career.players
    ).forEach(teamId=>{

      career.players[teamId]
        .forEach(p=>{

          p.contractYears =
            Math.max(
              0,
              p.contractYears-1
            );

        });

    });

    alert(
      "🎉 Season baru dimulai!"
    );

  }

  save();

  dashboard();

}
